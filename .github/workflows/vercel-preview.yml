name: Vercel Preview Deployment

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  Deploy-Preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      # `vercel pull` only writes variables to .vercel/.env.preview.local -- it
      # does not export them into this job's shell environment. The `vercel
      # build`/`vercel deploy` steps below read that file internally on their
      # own, but a plain `npx prisma migrate deploy` does not, so prisma.config.ts's
      # `process.env.NEON_DATABASE_DATABASE_URL || process.env.DATABASE_URL`
      # resolved to undefined and migrate deploy failed with "datasource.url
      # property is required". Re-export the pulled values into $GITHUB_ENV so
      # every later step actually has them in process.env.
      - name: Export Vercel Environment Variables
        run: grep -v '^#' .vercel/.env.preview.local >> "$GITHUB_ENV"

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
